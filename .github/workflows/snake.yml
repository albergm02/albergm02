name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#FF9F80&color_dots=#FFF3E6,#FFE3CC,#FFD1A9,#FFB48F,#FF9F80
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF9F80&color_dots=#2B2118,#5C3A2A,#8A5A44,#E8A07C,#FFB48F

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
