<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Portátil con código animado">
  <rect width="400" height="300" rx="24" fill="#FFF3E6"/>
  <!-- sol / círculo -->
  <circle cx="320" cy="62" r="30" fill="#FFD1A9"><animate attributeName="r" values="30;34;30" dur="4s" repeatCount="indefinite"/></circle>
  <!-- nubes -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="70" cy="55" rx="34" ry="12"><animate attributeName="cx" values="70;95;70" dur="9s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="250" cy="35" rx="26" ry="9"><animate attributeName="cx" values="250;228;250" dur="11s" repeatCount="indefinite"/></ellipse>
  </g>
  <!-- pantalla -->
  <rect x="85" y="85" width="230" height="140" rx="12" fill="#5C3A2A"/>
  <rect x="95" y="95" width="210" height="120" rx="6" fill="#FFF8F1"/>
  <circle cx="106" cy="106" r="3" fill="#FF9F80"/><circle cx="117" cy="106" r="3" fill="#FFD1A9"/><circle cx="128" cy="106" r="3" fill="#FFE3CC"/>
  <!-- líneas de código -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="108" y1="128" x2="170" y2="128" stroke="#FF9F80"><animate attributeName="x2" values="108;170;170" keyTimes="0;0.2;1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="124" y1="146" x2="230" y2="146" stroke="#FFB48F"><animate attributeName="x2" values="124;124;230;230" keyTimes="0;0.2;0.4;1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="124" y1="164" x2="196" y2="164" stroke="#FFD1A9"><animate attributeName="x2" values="124;124;196;196" keyTimes="0;0.4;0.6;1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="108" y1="182" x2="258" y2="182" stroke="#E8A07C"><animate attributeName="x2" values="108;108;258;258" keyTimes="0;0.6;0.8;1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="108" y1="200" x2="150" y2="200" stroke="#FFC9A3"><animate attributeName="x2" values="108;108;150;150" keyTimes="0;0.8;0.95;1" dur="6s" repeatCount="indefinite"/></line>
  </g>
  <!-- cursor -->
  <rect x="270" y="194" width="6" height="14" fill="#5C3A2A"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <!-- base -->
  <path d="M60 225 H340 L328 245 Q326 250 320 250 H80 Q74 250 72 245 Z" fill="#FFB48F"/>
  <rect x="170" y="228" width="60" height="6" rx="3" fill="#FFE3CC"/>
  <!-- taza -->
  <g transform="translate(345 205)">
    <rect x="0" y="0" width="28" height="30" rx="6" fill="#FF9F80"/>
    <path d="M28 8 q12 0 12 9 q0 9 -12 9" fill="none" stroke="#FF9F80" stroke-width="4"/>
    <path d="M8 -4 q-4 -8 0 -14" stroke="#FFC9A3" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M18 -4 q-4 -8 0 -14" stroke="#FFC9A3" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
